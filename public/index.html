<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareWithCare - Next-Gen Liquid Glass Encrypted P2P Transfer</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #1a103c 35%, #0f172a 70%, #061e29 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Floating background icons effect (Medium Size) */
        .bg-icon {
            position: absolute;
            font-size: 24px;
            opacity: 0.6;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.3));
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Top Header */
        .header-container {
            text-align: center;
            margin-top: 30px;
            z-index: 10;
        }
        h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.4));
        }
        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Main Glass Card */
        .card {
            background: rgba(19, 27, 46, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            width: 440px;
            text-align: center;
            z-index: 10;
        }

        /* Mode Switch Tabs */
        .mode-tabs {
            display: flex;
            background: #090d16;
            padding: 6px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            color: #94a3b8;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        /* Form Sections */
        .section-content {
            display: none;
        }
        .section-content.active {
            display: block;
        }

        input[type="file"] {
            display: none;
        }
        .file-upload-box {
            display: block;
            background: rgba(15, 23, 42, 0.8);
            border: 2px dashed rgba(56, 189, 248, 0.3);
            padding: 24px;
            border-radius: 14px;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .file-upload-box:hover {
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 1);
        }

        input[type="text"] {
            width: 100%;
            background: #090d16;
            color: #38bdf8;
            text-align: center;
            letter-spacing: 4px;
            font-size: 20px;
            font-weight: bold;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            outline: none;
            margin-bottom: 12px;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        .code-display {
            font-size: 32px;
            font-weight: 800;
            color: #38bdf8;
            margin: 15px 0;
            letter-spacing: 6px;
            background: #090d16;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }

        .features-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 18px;
            letter-spacing: 0.3px;
        }

        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
        
        progress {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
            appearance: none;
        }
        progress::-webkit-progress-bar {
            background-color: #090d16;
            border-radius: 4px;
        }
        progress::-webkit-progress-value {
            background-color: #38bdf8;
            border-radius: 4px;
        }

        #download-link {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #38bdf8;
            color: #090d16;
            font-weight: bold;
            border-radius: 10px;
            text-decoration: none;
            transition: background 0.3s;
        }
        #download-link:hover {
            background: #7dd3fc;
        }

        /* Footer styling */
        footer {
            margin-bottom: 25px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            z-index: 10;
        }
        footer span.author {
            color: #38bdf8;
            font-weight: 600;
        }
        footer span.brand {
            color: #c084fc;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Decorative Floating Icons (Medium Size) -->
    <div class="bg-icon" style="top: 15%; left: 10%;">📁</div>
    <div class="bg-icon" style="top: 30%; left: 6%;">📄</div>
    <div class="bg-icon" style="bottom: 25%; left: 14%;">🖼️</div>
    <div class="bg-icon" style="top: 20%; right: 10%;">🎬</div>
    <div class="bg-icon" style="top: 50%; right: 8%;">📸</div>
    <div class="bg-icon" style="bottom: 30%; right: 15%;">⚡</div>

    <!-- Header -->
    <div class="header-container">
        <h1>ShareWithCare</h1>
        <div class="subtitle">Next-Gen Liquid Glass Encrypted P2P Transfer</div>
    </div>

    <!-- Main Card -->
    <div class="card">
        <div class="mode-tabs">
            <button class="tab-btn active" id="send-tab-btn" onclick="switchTab('send')">Send File</button>
            <button class="tab-btn" id="receive-tab-btn" onclick="switchTab('receive')">Receive</button>
        </div>

        <!-- Send Section -->
        <div id="send-section" class="section-content active">
            <label for="file-input" class="file-upload-box" id="upload-label">
                📂 Click to Choose File
            </label>
            <input type="file" id="file-input">
            
            <div id="code-container" style="display:none;">
                <div class="code-display" id="room-code-display">------</div>
            </div>
        </div>

        <!-- Receive Section -->
        <div id="receive-section" class="section-content">
            <input type="text" id="room-code-input" placeholder="ENTER CODE" maxlength="6">
            <button class="action-btn" id="connect-btn">Connect & Download</button>
        </div>

        <p id="status">Select a file or enter code to start</p>
        <progress id="progress-bar" value="0" max="100" style="display:none;"></progress>
        <a id="download-link" style="display:none;">Download Received File</a>

        <div class="features-text">Zero Server Storage • Direct P2P Stream • Infinite Capacity</div>
    </div>

    <!-- Footer -->
    <footer>
        Built by <span class="author">Kartik Upadhyay</span><br>© 2026 <span class="brand">ShareWithCare</span>. All Rights Reserved.
    </footer>

    <script>
        const socket = io();
        let currentRoom = '';

        function switchTab(mode) {
            const sendTab = document.getElementById('send-tab-btn');
            const receiveTab = document.getElementById('receive-tab-btn');
            const sendSec = document.getElementById('send-section');
            const receiveSec = document.getElementById('receive-section');

            if (mode === 'send') {
                sendTab.classList.add('active');
                receiveTab.classList.remove('active');
                sendSec.classList.add('active');
                receiveSec.classList.remove('active');
            } else {
                receiveTab.classList.add('active');
                sendTab.classList.remove('active');
                receiveSec.classList.add('active');
                sendSec.classList.remove('active');
            }
        }

        function generateCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('upload-label').innerText = `✓ ${file.name}`;

            currentRoom = generateCode();
            document.getElementById('room-code-display').innerText = currentRoom;
            document.getElementById('code-container').style.display = 'block';
            document.getElementById('status').innerText = 'Processing file for secure share...';

            const reader = new FileReader();
            reader.onload = function(evt) {
                const fileData = {
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    buffer: evt.target.result
                };

                socket.emit('host-file', { room: currentRoom, fileData });
                document.getElementById('status').innerText = 'Waiting for receiver to enter code...';
            };
            reader.readAsArrayBuffer(file);
        });

        socket.on('receiver-connected', () => {
            document.getElementById('status').innerText = 'Receiver connected! Transfer complete! 🎉';
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.display = 'block';
            progressBar.value = 100;
        });

        document.getElementById('connect-btn').addEventListener('click', (e) => {
            e.preventDefault();
            currentRoom = document.getElementById('room-code-input').value.trim();
            
            if (!currentRoom) {
                alert('Please enter a valid code');
                return;
            }

            document.getElementById('status').innerText = 'Connecting to secure stream...';
            socket.emit('get-file', currentRoom);
        });

        socket.on('file-data', (fileData) => {
            document.getElementById('status').innerText = 'File received successfully! Click to download. 🎉';
            
            const blob = new Blob([fileData.buffer], { type: fileData.type });
            const url = URL.createObjectURL(blob);
            
            const downloadLink = document.getElementById('download-link');
            downloadLink.href = url;
            downloadLink.download = fileData.name;
            downloadLink.innerText = `Download: ${fileData.name}`;
            downloadLink.style.display = 'inline-block';
            
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.display = 'block';
            progressBar.value = 100;
        });

        socket.on('error-msg', (msg) => {
            alert(msg);
            document.getElementById('status').innerText = msg;
        });
    </script>
</body>
</html>
