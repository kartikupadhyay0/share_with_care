<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareWithCare - Ultimate Glossy P2P Transfer</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        
        html, body { 
            height: 100%;
            background: #040814; 
            color: #ffffff; 
            overflow-x: hidden; 
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr auto;
            align-items: center;
            justify-items: center;
            position: relative;
            min-height: 100vh;
        }

        /* SKY BLUE & PINK AMBIENT GLOW */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(56, 189, 248, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* WORKING FLOATING ELEMENTS CONTAINER */
        .floating-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .float-item {
            position: absolute;
            font-size: 3.5rem;
            opacity: 0.7;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.8));
            animation: floatUpDown 6s infinite alternate ease-in-out;
        }

        .item-1 { top: 15%; left: 10%; animation-duration: 7s; }
        .item-2 { top: 75%; left: 15%; animation-duration: 9s; animation-delay: 1s; }
        .item-3 { top: 20%; right: 12%; animation-duration: 8s; animation-delay: 2s; }
        .item-4 { top: 70%; right: 15%; animation-duration: 6s; animation-delay: 1.5s; }
        .item-5 { top: 45%; left: 5%; animation-duration: 10s; animation-delay: 0.5s; }
        .item-6 { top: 50%; right: 8%; animation-duration: 8.5s; animation-delay: 2.5s; }

        @keyframes floatUpDown {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-40px) rotate(20deg); }
        }

        header, .container, footer {
            position: relative;
            z-index: 10;
        }

        header { 
            text-align: center; 
            padding: 20px 20px 5px 20px; 
            width: 100%;
        }
        
        header h1 { 
            font-size: clamp(2.8rem, 7vw, 6rem); 
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 15%, #38bdf8 55%, #ec4899 95%); 
            background-clip: text;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: -2px;
            line-height: 1.1;
            filter: drop-shadow(0 10px 25px rgba(56, 189, 248, 0.4));
        }

        header p { color: #94a3b8; font-size: 1.1rem; margin-top: 5px; }

        .container { 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-top: 1px solid rgba(56, 189, 248, 0.4); 
            padding: 30px 25px; 
            border-radius: 28px; 
            width: 100%; 
            max-width: 460px; 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8); 
            text-align: center; 
            margin: auto;
        }

        .btn-group { display: flex; gap: 15px; margin-bottom: 18px; }
        
        .main-btn { 
            flex: 1; 
            padding: 15px; 
            border: none; 
            border-radius: 14px; 
            font-weight: 700; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: all 0.3s ease; 
        }
        
        .btn-send { 
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); 
            color: white; 
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
        }
        .btn-send:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .btn-receive { 
            background: rgba(255, 255, 255, 0.05); 
            color: #ffffff; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .btn-receive:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(236, 72, 153, 0.4); }

        input[type="file"], input[type="text"] { 
            width: 100%; 
            padding: 15px; 
            background: rgba(4, 8, 20, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 14px; 
            color: white; 
            font-size: 1rem; 
            margin-bottom: 16px; 
            outline: none; 
        }
        input[type="text"] { text-align: center; letter-spacing: 8px; font-weight: 800; font-size: 1.4rem; color: #38bdf8; }

        input[type="file"]::file-selector-button { 
            background: linear-gradient(135deg, #38bdf8, #2563eb); 
            color: white; 
            border: none; 
            padding: 10px 14px; 
            border-radius: 10px; 
            cursor: pointer; 
            margin-right: 12px; 
            font-weight: 700;
        }

        .code-box { 
            font-size: 2.6rem; 
            font-weight: 800; 
            letter-spacing: 8px; 
            color: #38bdf8; 
            background: rgba(4, 8, 20, 0.9); 
            padding: 16px; 
            border-radius: 16px; 
            margin: 16px 0; 
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        
        #status { font-size: 1rem; color: #e2e8f0; margin-top: 12px; font-weight: 600; }
        
        progress { width: 100%; height: 10px; border-radius: 5px; appearance: none; margin-top: 16px; background: rgba(4, 8, 20, 0.8); }
        progress::-webkit-progress-value { background: linear-gradient(90deg, #38bdf8, #ec4899); border-radius: 5px; }

        footer { 
            text-align: center; 
            padding: 15px; 
            width: 100%; 
            border-top: 1px solid rgba(255, 255, 255, 0.06); 
            background: rgba(4, 8, 20, 0.95); 
        }
        footer p { font-size: 0.9rem; color: #94a3b8; }
        footer span { color: #38bdf8; font-weight: 800; }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <div class="floating-container">
        <div class="float-item item-1">📁</div>
        <div class="float-item item-2">🖼️</div>
        <div class="float-item item-3">🎬</div>
        <div class="float-item item-4">⚡</div>
        <div class="float-item item-5">📄</div>
        <div class="float-item item-6">📷</div>
    </div>

    <header>
        <h1>ShareWithCare</h1>
        <p>Next-Gen Liquid Glass Encrypted P2P Transfer</p>
    </header>

    <div class="container">
        <div id="menu">
            <div class="btn-group">
                <button class="main-btn btn-send" onclick="startSender()">Send File</button>
                <button class="main-btn btn-receive" onclick="startReceiverPrompt()">Receive</button>
            </div>
            <p style="color: #94a3b8; font-size: 0.85rem;">Zero Server Storage • Direct P2P Stream • Infinite Capacity</p>
        </div>

        <div id="sender-section" style="display:none;">
            <input type="file" id="file-input">
            <p style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 6px;">Your Secure Access Code:</p>
            <div class="code-box" id="code-display">...</div>
        </div>

        <div id="receiver-section" style="display:none;">
            <input type="text" id="code-input" placeholder="------" maxlength="6">
            <button class="main-btn btn-send" onclick="joinRoom()">Connect & Download</button>
        </div>

        <h3 id="status"></h3>
        <progress id="progress" value="0" max="100" style="display:none;"></progress>
    </div>

    <footer>
        <p>Built by <span>ShareWithCare</span></p>
        <p style="margin-top: 3px; font-size: 0.75rem; color: #64748b;">© 2026 ShareWithCare. All Rights Reserved.</p>
    </footer>

    <script>
        const socket = io();
        let pc, localFile, roomCode;

        function generateCode() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let code = "";
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function startSender() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('sender-section').style.display = 'block';
            
            roomCode = generateCode();
            document.getElementById('code-display').innerText = roomCode;
            socket.emit('create-room', roomCode);

            document.getElementById('file-input').addEventListener('change', e => {
                localFile = e.target.files[0];
                document.getElementById('status').innerText = "File loaded. Waiting for receiver authentication...";
            });
        }

        function startReceiverPrompt() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('receiver-section').style.display = 'block';
        }

        function joinRoom() {
            const code = document.getElementById('code-input').value.trim();
            if(code.length !== 6) {
                alert('Please enter a valid 6-digit code');
                return;
            }
            roomCode = code;
            socket.emit('join-room', roomCode);
            document.getElementById('status').innerText = "Establishing secure handshake...";
        }

        socket.on('invalid-code', (msg) => {
            alert(msg);
            location.reload();
        });

        socket.on('start-connection', async (code) => {
            document.getElementById('status').innerText = "Encrypted P2P Tunnel Active!";
            const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
            pc = new RTCPeerConnection(configuration);

            if (localFile) {
                const dataChannel = pc.createDataChannel('file-transfer');
                dataChannel.onopen = () => {
                    document.getElementById('status').innerText = "Streaming data at maximum velocity...";
                    document.getElementById('progress').style.display = 'block';
                    sendFileInChunks(dataChannel);
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('signal', { room: roomCode, type: 'offer', sdp: offer });
            } else {
                pc.ondatachannel = event => {
                    const receiveChannel = event.channel;
                    let receivedSize = 0;
                    let buffer = [];
                    document.getElementById('progress').style.display = 'block';

                    receiveChannel.onmessage = e => {
                        if (typeof e.data === 'string' && e.data === 'EOF') {
                            const blob = new Blob(buffer);
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = localFile ? localFile.name : "downloaded-file";
                            a.click();
                            document.getElementById('status').innerText = "Transfer Complete! Download successful.";
                        } else {
                            buffer.push(e.data);
                            receivedSize += e.data.byteLength;
                            if(localFile && localFile.size) {
                                let percent = (receivedSize / localFile.size) * 100;
                                document.getElementById('progress').value = percent;
                            }
                        }
                    };
                };
            }

            pc.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('signal', { room: roomCode, type: 'candidate', candidate: event.candidate });
                }
            };
        });

        socket.on('signal', async data => {
            if (!pc) {
                const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
                pc = new RTCPeerConnection(configuration);
                pc.onicecandidate = event => {
                    if (event.candidate) {
                        socket.emit('signal', { room: roomCode, type: 'candidate', candidate: event.candidate });
                    }
                };
            }

            if (data.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('signal', { room: roomCode, type: 'answer', sdp: answer });
            } else if (data.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } else if (data.type === 'candidate') {
                await pc.setRemoteDescription(new RTCIceCandidate(data.candidate));
            }
        });

        function sendFileInChunks(dataChannel) {
            const chunkSize = 65536; 
            const fileReader = new FileReader();
            let offset = 0;

            fileReader.onload = e => {
                dataChannel.send(e.target.result);
                offset += e.target.result.byteLength;
                
                let percent = (offset / localFile.size) * 100;
                document.getElementById('progress').value = percent;

                if (offset < localFile.size) {
                    readSlice(offset);
                } else {
                    dataChannel.send('EOF');
                    document.getElementById('status').innerText = "Transfer Complete! Payload delivered.";
                }
            };

            function readSlice(o) {
                const slice = localFile.slice(o, o + chunkSize);
                fileReader.readAsArrayBuffer(slice);
            }

            readSlice(0);
        }
    </script>
</body>
</html>
