<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareWithCare - Secure File Sharing</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 420px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #3b82f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #2563eb; }
        input[type="text"] {
            background: #0f172a;
            color: white;
            text-align: center;
            letter-spacing: 2px;
            font-size: 20px;
            border: 1px solid #334155;
        }
        .code-display {
            font-size: 32px;
            font-weight: bold;
            color: #38bdf8;
            margin: 15px 0;
            letter-spacing: 4px;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        progress {
            width: 100%;
            height: 20px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>ShareWithCare</h2>
        
        <!-- Sender Section -->
        <div id="sender-section">
            <input type="file" id="file-input">
            <div id="code-container" style="display:none;">
                <p>Your Secure Access Code:</p>
                <div class="code-display" id="room-code-display">------</div>
            </div>
        </div>

        <hr style="border-color: #334155; margin: 20px 0;">

        <!-- Receiver Section -->
        <div id="receiver-section">
            <p>Have a code?</p>
            <input type="text" id="room-code-input" placeholder="Enter Code" maxlength="6">
            <button id="connect-btn">Connect & Download</button>
        </div>

        <p id="status">Select a file or enter code to start</p>
        <progress id="progress-bar" value="0" max="100" style="display:none;"></progress>
        <a id="download-link" style="display:none; margin-top:15px; display:block; color:#38bdf8; text-decoration:none; font-weight:bold;">Download Received File</a>
    </div>

    <script>
        const socket = io();
        let currentRoom = '';

        function generateCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // --- SENDER: File Select Handler ---
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            currentRoom = generateCode();
            document.getElementById('room-code-display').innerText = currentRoom;
            document.getElementById('code-container').style.display = 'block';
            document.getElementById('status').innerText = 'Reading file and uploading...';

            const reader = new FileReader();
            reader.onload = function(evt) {
                const fileData = {
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    buffer: evt.target.result
                };

                // Create room and send file data to server room
                socket.emit('host-file', { room: currentRoom, fileData });
                document.getElementById('status').innerText = 'Waiting for receiver to enter code...';
            };
            reader.readAsArrayBuffer(file);
        });

        // Listen when receiver connects
        socket.on('receiver-connected', () => {
            document.getElementById('status').innerText = 'Receiver connected! Transferring file... 🎉';
            document.getElementById('progress-bar').style.display = 'block';
            document.getElementById('progress-bar').value = 100;
        });

        // --- RECEIVER: Connect Button Handler ---
        document.getElementById('connect-btn').addEventListener('click', (e) => {
            e.preventDefault();
            currentRoom = document.getElementById('room-code-input').value.trim();
            
            if (!currentRoom) {
                alert('Please enter a valid code');
                return;
            }

            document.getElementById('status').innerText = 'Requesting file from server...';
            
            // Request file using code
            socket.emit('get-file', currentRoom);
        });

        // Receive file data from server
        socket.on('file-data', (fileData) => {
            document.getElementById('status').innerText = 'File received successfully! Click below to save. 🎉';
            
            const blob = new Blob([fileData.buffer], { type: fileData.type });
            const url = URL.createObjectURL(blob);
            
            const downloadLink = document.getElementById('download-link');
            downloadLink.href = url;
            downloadLink.download = fileData.name;
            downloadLink.innerText = `Download: ${fileData.name}`;
            downloadLink.style.display = 'block';
        });

        socket.on('error-msg', (msg) => {
            alert(msg);
            document.getElementById('status').innerText = msg;
        });
    </script>
</body>
</html>
