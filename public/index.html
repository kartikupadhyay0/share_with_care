<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareWithCare - P2P File Sharing</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        button {
            background: #3b82f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #2563eb; }
        input[type="text"] {
            background: #0f172a;
            color: white;
            text-align: center;
            letter-spacing: 2px;
            font-size: 20px;
            border: 1px solid #334155;
        }
        .code-display {
            font-size: 32px;
            font-weight: bold;
            color: #38bdf8;
            margin: 15px 0;
            letter-spacing: 4px;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        progress {
            width: 100%;
            height: 20px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>ShareWithCare</h2>
        
        <!-- Sender Section -->
        <div id="sender-section">
            <input type="file" id="file-input">
            <div id="code-container" style="display:none;">
                <p>Your Secure Access Code:</p>
                <div class="code-display" id="room-code-display">------</div>
            </div>
        </div>

        <hr style="border-color: #334155; margin: 20px 0;">

        <!-- Receiver Section -->
        <div id="receiver-section">
            <p>Have a code?</p>
            <input type="text" id="room-code-input" placeholder="Enter Code" maxlength="6">
            <button id="connect-btn">Connect & Download</button>
        </div>

        <p id="status">Select a file or enter code to start</p>
        <progress id="progress-bar" value="0" max="100" style="display:none;"></progress>
        <a id="download-link" style="display:none; margin-top:15px; display:block; color:#38bdf8;">Download Received File</a>
    </div>

    <script>
        const socket = io();
        let pc;
        let dataChannel;
        let currentRoom = '';
        let fileToSend = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun.services.mozilla.com' }
            ]
        };

        function generateCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // --- SENDER LOGIC ---
        document.getElementById('file-input').addEventListener('change', (e) => {
            fileToSend = e.target.files[0];
            if (!fileToSend) return;

            currentRoom = generateCode();
            document.getElementById('room-code-display').innerText = currentRoom;
            document.getElementById('code-container').style.display = 'block';
            document.getElementById('status').innerText = 'Waiting for receiver authentication...';

            socket.emit('create-room', currentRoom);

            pc = new RTCPeerConnection(rtcConfig);
            dataChannel = pc.createDataChannel('file-transfer');
            setupDataChannel();

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { room: currentRoom, candidate: event.candidate });
                }
            };

            pc.createOffer().then(offer => {
                pc.setLocalDescription(offer);
                socket.emit('offer', { room: currentRoom, offer });
            });
        });

        socket.on('receiver-joined', async () => {
            document.getElementById('status').innerText = 'Receiver connected! Establishing P2P tunnel...';
        });

        socket.on('answer', async (answer) => {
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('ice-candidate', async (candidate) => {
            if (pc) {
                await pc.addIceCandidate(new RTCIceCandidate(candidate));
            }
        });

        function setupDataChannel() {
            dataChannel.onopen = () => {
                document.getElementById('status').innerText = 'Encrypted P2P Tunnel Active! Sending file...';
                sendFile();
            };
            dataChannel.onclose = () => {
                document.getElementById('status').innerText = 'Connection closed.';
            };
        }

        function sendFile() {
            const CHUNK_SIZE = 16384;
            const reader = new FileReader();
            let offset = 0;

            dataChannel.send(JSON.stringify({
                name: fileToSend.name,
                size: fileToSend.size,
                type: fileToSend.type
            }));

            const progressBar = document.getElementById('progress-bar');
            progressBar.style.display = 'block';

            reader.onload = (e) => {
                dataChannel.send(e.target.result);
                offset += e.target.result.byteLength;
                progressBar.value = (offset / fileToSend.size) * 100;

                if (offset < fileToSend.size) {
                    readNextChunk();
                } else {
                    document.getElementById('status').innerText = 'File Transfer Complete! 🎉';
                }
            };

            function readNextChunk() {
                const slice = fileToSend.slice(offset, offset + CHUNK_SIZE);
                reader.readAsArrayBuffer(slice);
            }

            readNextChunk();
        }

        // --- RECEIVER LOGIC ---
        document.getElementById('connect-btn').addEventListener('click', async (e) => {
            e.preventDefault(); // Prevents page reload

            currentRoom = document.getElementById('room-code-input').value.trim();
            if (!currentRoom) {
                alert('Please enter a valid code');
                return;
            }

            document.getElementById('status').innerText = 'Connecting to sender...';
            socket.emit('join-room', currentRoom);

            pc = new RTCPeerConnection(rtcConfig);

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { room: currentRoom, candidate: event.candidate });
                }
            };

            pc.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupReceiverDataChannel();
            };

            socket.on('offer', async (offer) => {
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('answer', { room: currentRoom, answer });
            });

            socket.on('ice-candidate', async (candidate) => {
                if (pc) {
                    await pc.addIceCandidate(new RTCIceCandidate(candidate));
                }
            });
        });

        let incomingFile = { metadata: null, receivedSize: 0, buffer: [] };

        function setupReceiverDataChannel() {
            dataChannel.onopen = () => {
                document.getElementById('status').innerText = 'Encrypted P2P Tunnel Active! Receiving file...';
            };

            dataChannel.onmessage = (event) => {
                const progressBar = document.getElementById('progress-bar');
                progressBar.style.display = 'block';

                if (typeof event.data === 'string') {
                    incomingFile.metadata = JSON.parse(event.data);
                    incomingFile.receivedSize = 0;
                    incomingFile.buffer = [];
                } else {
                    incomingFile.buffer.push(event.data);
                    incomingFile.receivedSize += event.data.byteLength;

                    progressBar.value = (incomingFile.receivedSize / incomingFile.metadata.size) * 100;

                    if (incomingFile.receivedSize === incomingFile.metadata.size) {
                        const blob = new Blob(incomingFile.buffer, { type: incomingFile.metadata.type });
                        const url = URL.createObjectURL(blob);
                        
                        const downloadLink = document.getElementById('download-link');
                        downloadLink.href = url;
                        downloadLink.download = incomingFile.metadata.name;
                        downloadLink.innerText = `Download: ${incomingFile.metadata.name}`;
                        downloadLink.style.display = 'block';

                        document.getElementById('status').innerText = 'File Received Successfully! Click to download. 🎉';
                    }
                }
            };
        }
    </script>
</body>
</html>
